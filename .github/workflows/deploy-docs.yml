name: Deploy course site (encrypted, Option B)

# This workflow lives in the PRIVATE source repo. It builds the MkDocs site, encrypts every
# page with StatiCrypt (passphrase-gated), and PUSHES ONLY THE ENCRYPTED HTML to a SEPARATE
# PUBLIC repo, which serves it via GitHub Pages. The markdown source never becomes public.
#
# ── One-time setup ───────────────────────────────────────────────────────────────────────
#   1. Create a PUBLIC repo under Tin Tech Consulting for the site (e.g. "under-the-hood-site").
#   2. Create a deploy token with write access to that public repo (a fine-grained PAT, or a
#      classic PAT with "repo" scope). Add it to THIS repo as the secret  PAGES_DEPLOY_TOKEN.
#   3. Add the course PIN as the secret  SITE_PASSPHRASE  (Settings → Secrets → Actions).
#   4. Fill in `external_repository` below (owner/public-repo).
#   5. In the PUBLIC repo: Settings → Pages → deploy from branch  gh-pages  (root).
#
# ── Rotate the PIN (e.g. monthly) ────────────────────────────────────────────────────────
#   Update the SITE_PASSPHRASE secret, then re-run this workflow (Actions → Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-encrypt-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict          # → ./site (plaintext build; never published as-is)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Encrypt the site with StatiCrypt
        env:
          # StatiCrypt reads the passphrase from this env var, so it never appears in logs.
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::SITE_PASSPHRASE secret is not set — refusing to publish an unprotected site."
            exit 1
          fi
          # Encrypt every HTML page recursively into ./_enc/site/, then overlay the encrypted
          # HTML back onto ./site (StatiCrypt only touches HTML, so CSS/JS/images are kept).
          npx -y staticrypt@3 site -r -d _enc --short
          cp -r _enc/site/. site/
          rm -rf _enc

      - name: Sanity check — no plaintext leaked
        run: |
          if grep -rqs "handful of parts doing simple jobs" site; then
            echo "::error::Plaintext content found in the built site — encryption did not cover everything."
            exit 1
          fi
          touch site/.nojekyll
          echo "OK: spot-check found no plaintext."

      # Push the ENCRYPTED ./site to the separate PUBLIC Pages repo.
      - name: Publish encrypted site to the public Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: TIN-TECH-OWNER/PUBLIC-PAGES-REPO   # TODO: set to owner/repo
          publish_dir: ./site
          publish_branch: gh-pages
          # cname: courses.tintech.example          # optional: a custom domain
