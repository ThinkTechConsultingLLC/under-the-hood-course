site_name: "Under the Hood — How Computers & AI Really Work"
site_description: "A hands-on, live-online course for adult beginners — how computers, the OS, networking, containers, and AI actually work."

# All course content lives in docs/ (MkDocs requires content in a child dir, not the repo root).
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Keep instructor-only and tooling files out of the published learner site.
exclude_docs: |
  prompts/
  _templates/
  **/solution/

nav:
  - Home: index.md
  - How to use this site: how-to-use-this-site.md
  - Start here: START-HERE/README.md
  - Syllabus: SYLLABUS.md
  - "M1 · What is a computer":
      - Overview: m1-what-is-a-computer/README.md
      - Notes: m1-what-is-a-computer/notes.md
      - Lab: m1-what-is-a-computer/lab/lab.md
  - "M2 · OS & filesystem":
      - Overview: m2-os-and-files/README.md
      - Notes: m2-os-and-files/notes.md
      - Lab: m2-os-and-files/lab/lab.md
  - "M3 · Command line":
      - Overview: m3-command-line/README.md
      - Notes: m3-command-line/notes.md
      - Lab: m3-command-line/lab/lab.md
  - "M4 · Inside the OS":
