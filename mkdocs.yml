      - Lab: m4-inside-the-os/lab/lab.md
  - "M5 · Networking & web":
      - Overview: m5-networking-and-web/README.md
      - Notes: m5-networking-and-web/notes.md
      - Lab: m5-networking-and-web/lab/lab.md
  - "M6 · Security & privacy":
